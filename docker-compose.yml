# Run everything:  docker compose up --build
# Open:            http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bloodlink
      POSTGRES_USER: bloodlink
      POSTGRES_PASSWORD: bloodlink
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodlink -d bloodlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/bloodlink
      DB_USER: bloodlink
      DB_PASS: bloodlink
      JWT_SECRET: change-this-to-a-long-random-secret-before-going-live-0123456789
      SEED_DEMO: "true"          # set to "false" for real use
    ports: ["8081:8080"]

  # Database viewer in the browser: http://localhost:8081
  adminer:
    image: adminer
    depends_on: [db]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports: ["8082:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3005:80"]

volumes:
  pgdata:
